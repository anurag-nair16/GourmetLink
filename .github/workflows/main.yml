name: Cleanup Expired Meal Plans

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'
    
    - name: List directory structure
      run: |
        pwd
        ls -la
        ls -la backend/  # Check if backend directory exists
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        elif [ -f "backend/requirements.txt" ]; then
          pip install -r backend/requirements.txt
        else
          echo "No requirements.txt found"
          exit 1
        fi
    
    - name: Run cleanup script
      env:
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        EMAIL_HOST: smtp.gmail.com
        EMAIL_PORT: 587
        EMAIL_USE_TLS: True
        EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        DEFAULT_FROM_EMAIL: ${{ secrets.EMAIL_HOST_USER }}
      run: |
        if [ -d "backend" ]; then
          cd backend
        fi
        python manage.py cleanup_mealplans --verbosity 2

    - name: Log completion time
      if: always()  # Run even if previous steps failed
      run: echo "Cleanup completed at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
